
cat > docs/index.html <<'EOF'
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="5; url=site/index.html">

    <meta name="theme-color" content="#080b12">
    <meta name="description" content="Hurtip — Uma linguagem de programação experimental construída em torno da simplicidade, clareza e versatilidade.">

    <title>Hurtip — Programming Language</title>

    <link rel="canonical" href="site/index.html">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% 40%, #14243b 0%, transparent 55%),
                #080b12;
            color: #f1f5f9;
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            animation: appear 1s ease forwards;
        }

        .brand {
            font-size: clamp(3.5rem, 10vw, 6rem);
            font-weight: 800;
            letter-spacing: -5px;
            background: linear-gradient(135deg, #ffffff, #80baff, #438cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            margin-top: 14px;
            color: #a5b4c8;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            letter-spacing: 0.4px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 42px;
            color: #8293aa;
            font-size: 0.85rem;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #55a5ff;
            box-shadow: 0 0 12px #55a5ff;
            animation: pulse 1.5s infinite;
        }

        .progress {
            width: 150px;
            height: 2px;
            margin: 18px auto 0;
            background: #1b2a3d;
            overflow: hidden;
            border-radius: 10px;
        }

        .progress::after {
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #438cff, #8cc5ff);
            transform-origin: left;
            animation: loading 5s linear forwards;
        }

        .link {
            display: inline-block;
            margin-top: 28px;
            color: #76b5ff;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .link:hover {
            color: #ffffff;
        }

        @keyframes pulse {
            50% { opacity: 0.35; }
        }

        @keyframes loading {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1 class="brand">Hurtip</h1>

        <p class="tagline">
            Simplicity. Clarity. Versatility.
        </p>

        <div class="status">
            <span class="dot"></span>
            <span>Redirecionando para o site oficial</span>
        </div>

        <div class="progress"></div>

        <a class="link" href="site/index.html">
            Acessar agora →
        </a>
    </main>
</body>
</html>
EOF
